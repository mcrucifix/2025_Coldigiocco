stages:
  - build
  - release # New stage

build:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pdf-cache # Unique cache key per branch
    paths:
      - 'Html/*.html'
      - 'R/EData.RData'
      - 'R/Z23_morlet.RData'
      - '2025_Coldigiocco_presentation.toc'
      - '2025_Coldigiocco_presentation.snm'
      - '2025_Coldigiocco_presentation.nav'
      - '2025_Coldigiocco_presentation-blx.bib'
    policy: pull-push # Default behavior: pull the cache before script, push after script
  variables:
    GIT_SUBMODULE_STRATEGY: recursive  # Or 'normal' if you don't have nested submodules
  script:
    - git submodule update
    - echo `ls templates`
    - make presentation
    - make html
    - echo "PDF_JOB_ID=$CI_JOB_ID" > artifacts_vars.env 
  artifacts:
    paths:
       - Pdf_output/2025_Coldigiocco_presentation.pdf
       - Html/beatings.html
       - Html/finding_eccentricity_frequenties.html
       - Html/ob_vs_ecc_beatings.html
       - Html/insolation.html
       - artifacts_vars.env
    reports:
      dotenv: artifacts_vars.env # NEW: Make variables available to subsequent jobs
    expire_in: 1 week
  only:
    - master
  when: manual

release:
  stage: release
  needs:
    - job: build
  script:
    # Base URL for artifacts from the 'build' job on this specific branch/tag
    - export BASE_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw"
    - |
      glab release create "${CI_COMMIT_REF_SLUG}" \
        --name "Release ${CI_COMMIT_SHORT_SHA}" \
        --assets-links "[{\"name\":\"Presentation PDF\",\"url\":\"${BASE_URL}/Pdf_output/2025_Coldigiocco_presentation.pdf?job=build\"},\  
                         {\"name\":\"Beatings HTML\",\"url\":\"${BASE_URL}/Html/beatings.html?job=build\"}.  \
                         {\"name\":\"Eccentricity Frequencies HTML\",\"url\":\"${BASE_URL}/Html/finding_eccentricity_frequenties.html?job=build\"}.  \
                         {\"name\":\"Ob vs Ecc Beatings HTML\",\"url\":\"${BASE_URL}/Html/ob_vs_ecc_beatings.html?job=build\"}.  \
                         {\"name\":\"Insolation HTML\",\"url\":\"${BASE_URL}/Html/insolation.html?job=build\"}]"
  when: manual # Make this manual to control when a release is made

